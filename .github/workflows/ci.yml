name: CI - Testes e Lint

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["main"]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar lint
        run: flake8 app.py api_feriados.py test_app.py test_api_feriados.py --max-line-length=100

      - name: Rodar testes
        run: pytest test_app.py test_api_feriados.py -v
